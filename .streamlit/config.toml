[browser]
gatherUsageStats = false

[server]
headless = true
showEmailPrompt = false
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#D4AF37"
backgroundColor = "#FBF6EA"
secondaryBackgroundColor = "#F3E9D2"
textColor = "#1E1A12"
font = "sans serif"

